/* 阶段：查不到就是「未判定」，不回落成第一个阶段 */
function stageMeta(k){ return STAGES.find(s => s.key === k) || null; }
function stageIndex(k){ return STAGES.findIndex(s => s.key === k); }   /* -1 = 未判定 */
const STAGE_ALIAS = { '启动':'ignition','启动期':'ignition','发酵':'expansion','发酵期':'expansion','加速':'acceleration','加速期':'acceleration','分歧':'divergence','分歧期':'divergence','退潮':'fade','退潮期':'fade' };
function asStage(v){
  if(v === null || v === undefined || v === '') return null;
  const s = String(v).trim();
  const k = s.toLowerCase();
  if(stageMeta(k)) return k;
  return STAGE_ALIAS[s] || null;
}
function stageLabelOf(k, label){ if(label) return label; const s = stageMeta(k); return s ? s.label : '未判定'; }
function stageDesc(k){ const s = stageMeta(k); return s ? s.desc : '阶段未判定'; }
function stageClass(k){ return stageMeta(k) ? ('st-' + k) : 'st-none'; }

/* 策略基调：兼容旧写法（offense/defense）与中文 */
function asStance(v){
  if(v === null || v === undefined || v === '') return null;
  const s = String(v).trim().toLowerCase();
  if(s === 'offense' || s === 'offensive' || s === '进攻') return 'offensive';
  if(s === 'balanced' || s === 'neutral' || s === '中性' || s === '均衡') return 'balanced';
  if(s === 'defense' || s === 'defensive' || s === '防御') return 'defensive';
  return null;
}
const STANCE_LABEL = { offensive:'进攻', balanced:'均衡', defensive:'防御' };

const THEME_TYPE = { industry:'行业型', concept:'概念型', style:'风格型' };
const THEME_ALIAS = { 'industry':'industry', '行业':'industry', '行业型':'industry', 'concept':'concept', '概念':'concept', '概念型':'concept', 'style':'style', '风格':'style', '风格型':'style' };
const DRIVER_ALIAS = { 'policy':'policy', '政策':'policy', 'industry':'industry', '产业':'industry', 'earnings':'earnings', '业绩':'earnings', 'event':'event', '事件':'event', 'liquidity':'liquidity', '流动性':'liquidity' };
const ROLE_ALIAS = { 'leader':'leader', '龙头':'leader', 'core':'core', '中军':'core', 'follower':'follower', '补涨':'follower', '跟随':'follower' };
const DATA_MODE_ALIAS = { 'live':'live', '实盘':'live', '实时':'live', 'delayed':'delayed', '延迟':'delayed', 'demo':'demo', '示例':'demo', '样例':'demo' };
/* 非法枚举值不保留原样（页面上会露出英文/中文混杂的原始串），统一折成 null，由渲染层显示「未标注」 */
function enumPick(v, map){
  if(v === null || v === undefined || v === '') return null;
  const s = String(v).trim();
  return map[s] || map[s.toLowerCase()] || null;
}
const DQ_STATUS = { ok:['完整','st-expansion'], partial:['部分缺失','st-divergence'], degraded:['降级','st-fade'] };
function dqLabel(s){ return DQ_STATUS[s] ? DQ_STATUS[s][0] : '未标注'; }
function dqClass(s){ return DQ_STATUS[s] ? DQ_STATUS[s][1] : 'st-none'; }
function pulseLabel(pc){
  const n = toNum(pc && pc.rules_passed);
  return n === null ? '未检验' : Math.round(n) + '/3 通过';
}
function pulseClass(pc){
  if(!pc || (toNum(pc.rules_passed) === null && typeof pc.passed !== 'boolean')) return 'st-none';
  return pc.passed ? 'st-expansion' : 'st-fade';
}
function scoreTone(s){
  const n = toNum(s);
  if(n === null) return '#8d9bb0';
  return n >= 80 ? '#ea2261' : n >= 65 ? '#533afd' : n >= 50 ? '#665efd' : '#8d9bb0';
}

/* ============ 契约体检 ============
   提示词里的硬规则本来就是机械可判的：P1/P2/P3 三条闸门、R1/R2/R3 三档惩罚、
   五个阶段的判据、六因子的算术。字段既然都在报告里，就不该只信任它写下的结论——
   这里按规则重算一遍，和记录值逐项比对。算不出来的时候（字段为 null）明确标「无法验算」，
   不用默认值冒充。 */
const STAGE_ORDER = ['fade','divergence','acceleration','expansion','ignition'];

function calcPulse(m){
  const mt = m.metrics || {}, ps = m.persistence || {};
  const d = toNum(ps.days_top10_20), c = toNum(ps.consecutive_top10);
  const up = toNum(mt.breadth_up_ratio), nh = toNum(mt.new_high_ratio);
  const d5 = toNum(mt.turnover_share_chg_5), q = toNum(mt.turnover_share_pct_250);
  return [
    { id:'P1', label:'持续性', ok:(d === null || c === null) ? null : (d >= 6 && c >= 2),
      text:'前10 ' + fixed(d,0) + '/20 天，连续 ' + fixed(c,0) + ' 天' },
    { id:'P2', label:'广度', ok:(up === null || nh === null) ? null : (up >= 0.55 && nh >= 0.08),
      text:'上涨 ' + pct(up,0) + '，新高 ' + pct(nh,1) },
    { id:'P3', label:'量能', ok:(d5 === null || q === null) ? null : (d5 >= 0.005 && q >= 0.60),
      text:'份额Δ5 ' + pctPoint(d5) + '，分位 ' + pct(q,0) }
  ];
}

function calcPenalty(m){
  const mt = m.metrics || {};
  const q = toNum(mt.turnover_share_pct_250), st = toNum(mt.max_streak), cw = toNum(mt.crowding_pct);
  const c60 = toNum(mt.chg_60d), f5 = toNum(mt.net_inflow_5_yi);
  const hits = [];
  if(q !== null && st !== null && q > 0.95 && st >= 5)
    hits.push({ id:'R1', value:12, why:'份额分位 ' + q.toFixed(2) + ' > 0.95 且连板 ' + st + ' ≥ 5' });
  if(q !== null && cw !== null && q > 0.90 && cw > 0.90)
    hits.push({ id:'R2', value:6, why:'份额分位 ' + q.toFixed(2) + ' > 0.90 且拥挤度 ' + cw.toFixed(2) + ' > 0.90' });
  if(c60 !== null && f5 !== null && c60 > 0.60 && f5 < 0)
    hits.push({ id:'R3', value:8, why:'60 日涨幅 ' + (c60 * 100).toFixed(1) + '% > 60% 且 5 日资金 ' + f5.toFixed(1) + ' 亿 < 0' });
  const verifiable = (q !== null && (st !== null || cw !== null)) || (c60 !== null && f5 !== null);
  return { value: hits.length ? Math.max.apply(null, hits.map(h => h.value)) : 0, hits: hits, verifiable: verifiable };
}

function calcStage(m){
  const mt = m.metrics || {}, ps = m.persistence || {};
  const c5 = toNum(mt.chg_5d), c20 = toNum(mt.chg_20d), q = toNum(mt.turnover_share_pct_250);
  const cur = toNum(mt.max_streak), prev = toNum(mt.max_streak_prev), seal = toNum(mt.seal_rate);
  const crowd = toNum(mt.crowding_pct), lu = toNum(mt.limit_up_count), up = toNum(mt.breadth_up_ratio);
  const d20 = toNum(mt.turnover_share_chg_20), lead = toNum(mt.leader_chg_5d), d5 = toNum(mt.turnover_share_chg_5);
  const days = toNum(ps.days_top10_20);
  const set = {
    fade: [
      ['份额Δ20 < −0.5pct', d20 === null ? null : (d20 < -0.005)],
      ['龙头 5 日跌幅 > 8%', lead === null ? null : (lead < -0.08)],
      ['上涨占比 < 45%', up === null ? null : (up < 0.45)]
    ],
    divergence: [
      ['5 日涨幅 < 20 日/4', (c5 === null || c20 === null) ? null : (c5 < c20 / 4)],
      ['份额分位 > 90', q === null ? null : (q > 0.90)],
      ['连板回落 ≥ 2 级', (cur === null || prev === null) ? null : (prev - cur >= 2)]
    ],
    acceleration: [
      ['20 日涨幅 > 25%', c20 === null ? null : (c20 > 0.25)],
      ['拥挤分位 > 85', crowd === null ? null : (crowd > 0.85)],
      ['封板率 > 75%', seal === null ? null : (seal > 0.75)]
    ],
    expansion: [
      ['份额分位 60~85', q === null ? null : (q >= 0.60 && q <= 0.85)],
      ['涨停 ≥ 5', lu === null ? null : (lu >= 5)],
      ['连板 3~4', cur === null ? null : (cur >= 3 && cur <= 4)],
      ['上涨占比 ≥ 60%', up === null ? null : (up >= 0.60)]
    ],
    ignition: [
      ['份额Δ5 ≥ +0.5pct', d5 === null ? null : (d5 >= 0.005)],
      ['20 日内进前十 ≤ 8 天', days === null ? null : (days <= 8)],
      ['涨停 2~5 家', lu === null ? null : (lu >= 2 && lu <= 5)]
    ]
  };
  const hits = {};
  let picked = null;
  /* 按 fade→divergence→acceleration→expansion→ignition 的顺序取第一个命中 ≥2 项的：
     越靠后的阶段优先级越高，因为它描述的是更晚发生的状态。 */
  STAGE_ORDER.forEach(k => {
    const list = set[k];
    const yes = list.filter(x => x[1] === true).length;
    const known = list.filter(x => x[1] !== null).length;
    hits[k] = { yes: yes, known: known, list: list };
    if(picked === null && yes >= 2) picked = k;
  });
  return { stage: picked, hits: hits };
}

function auditReport(r){
  const items = [], of = {};
  const add = (level, scope, text) => items.push({ level: level, scope: scope, text: text });
  const flag = (m, level, text) => { const k = String(m.id || m.name); (of[k] = of[k] || []).push({ level: level, text: text }); };
  const list = r.mainlines || [];
  const outNames = ((r.rotation && r.rotation.outflow) || []).map(x => String(x.name || '').trim());

  list.forEach(m => {
    /* --- 反脉冲：按 metrics 重算条数 --- */
    const pr = calcPulse(m);
    const known = pr.filter(x => x.ok !== null).length;
    const yes = pr.filter(x => x.ok === true).length;
    const pc = m.persistence && m.persistence.pulse_check ? m.persistence.pulse_check : {};
    const claimed = toNum(pc.rules_passed);
    const mark = pr.map(x => x.id + (x.ok === true ? '✓' : x.ok === false ? '✗' : '?')).join(' ');
    if(known > 0){
      if(claimed !== null && Math.round(claimed) !== yes)
        flag(m, 'err', '反脉冲实算 ' + yes + ' 条通过，报告写 ' + Math.round(claimed) + ' 条（' + mark + '）');
      if(typeof pc.passed === 'boolean' && pc.passed !== (yes >= 2))
        flag(m, 'err', 'pulse_check.passed 与实算不符：实算 ' + yes + ' 条，' + (yes >= 2 ? '应通过' : '应不通过'));
      if(yes < 2){
        const conf = toNum(m.stage_confidence);
        const exempt = m.stage === 'fade' && conf !== null && conf <= 0.6 && outNames.indexOf(String(m.name || '').trim()) >= 0;
        if(exempt) add('info', m.name, '未过闸门（' + yes + ' 条），按 §3 存量豁免保留 1 期');
        else flag(m, 'err', '未过 §3 闸门（' + yes + ' 条通过），不应出现在主线榜；退潮期存量需 stage=fade、置信度 ≤0.6 且列入轮动流出');
      }
    }

    /* --- 惩罚项：R1/R2/R3 重算，多项取最大值 --- */
    const cp = calcPenalty(m);
    const pen = toNum(m.penalty);
    if(cp.verifiable && pen !== null && Math.abs(cp.value - pen) > 0.01)
      flag(m, 'err', '惩罚项实算 ' + cp.value + ' 分，报告写 ' + fixed(pen, 2) + ' 分' +
        (cp.hits.length ? '（命中 ' + cp.hits.map(h => h.id).join(' / ') + '：' + cp.hits[0].why + '）' : '（R1/R2/R3 均未触发）'));

    /* --- 阶段：按判据重算 --- */
    const cs = calcStage(m);
    if(cs.stage && m.stage && cs.stage !== m.stage){
      const h = cs.hits[cs.stage];
      flag(m, 'warn', '阶段按判据应为「' + stageLabelOf(cs.stage) + '」（命中 ' + h.yes + ' 项：' +
        h.list.filter(x => x[1] === true).map(x => x[0]).join('、') + '），报告写「' + stageLabelOf(m.stage) + '」');
    }else if(!cs.stage && m.stage){
      let bestKey = null, bestN = -1;
      STAGE_ORDER.forEach(k => { if(cs.hits[k].yes > bestN){ bestN = cs.hits[k].yes; bestKey = k; } });
      if(bestN < 2) flag(m, 'warn', '阶段判据均不足 2 项（最多命中 ' + bestN + ' 项），「' + stageLabelOf(m.stage) + '」无法复算');
    }

    /* --- 打分卡算术 --- */
    const bd = m.score_breakdown || [];
    if(bd.length !== 6) flag(m, 'warn', '因子拆解 ' + bd.length + ' 项，契约为 6 项');
    const wsum = bd.reduce((s, b) => s + (toNum(b.weight) || 0), 0);
    if(bd.length && Math.abs(wsum - 100) > 0.05) flag(m, 'warn', '六因子权重合计 ' + fixed(wsum, 1) + '%，应为 100%');
    bd.forEach(b => {
      const nv = toNum(b.normalized), w = toNum(b.weight), c = toNum(b.contribution);
      if(nv !== null && w !== null && c !== null && Math.abs(nv * w / 100 - c) > 0.1)
        flag(m, 'warn', (b.label || b.key) + ' 的 contribution ' + fixed(c, 2) + ' 与 normalized×weight/100 = ' + (nv * w / 100).toFixed(2) + ' 不符');
    });
    const rsRow = bd.filter(b => b.key === 'rs')[0];
    const rs20 = toNum(m.metrics && m.metrics.rs_20);
    if(rsRow && rs20 !== null && toNum(rsRow.raw) !== null && Math.abs(toNum(rsRow.raw) - rs20) > 0.0005)
      flag(m, 'warn', 'rs 的 raw（' + fixed(rsRow.raw, 3) + '）与 metrics.rs_20（' + fixed(rs20, 3) + '）不是同一个数');
    const allCon = bd.length && bd.every(b => toNum(b.contribution) !== null);
    const ssum = allCon ? bd.reduce((s, b) => s + toNum(b.contribution), 0) : null;
    const rec = toNum(m.score);
    if(ssum !== null && pen !== null && rec !== null && Math.abs(ssum - pen - rec) > 0.5)
      flag(m, 'err', 'Σ贡献 ' + fixed(ssum, 2) + ' − 惩罚 ' + fixed(pen, 2) + ' = ' + fixed(ssum - pen, 2) + '，报告写 ' + fixed(rec, 1));

    /* --- 证据链 --- */
    const dn = (m.drivers || []).length;
    if(dn < 2) flag(m, 'warn', '驱动 ' + dn + ' 条，契约要求 2～4 条');
  });

  /* --- 全局一致性 --- */
  const sc = r.scenarios || [];
  if(sc.length !== 3) add('warn', '全局', '情景 ' + sc.length + ' 个，契约要求恰好 3 个');
  const probs = sc.map(s => toNum(s.probability));
  if(probs.length && probs.every(p => p !== null)){
    const ps = probs.reduce((a, b) => a + b, 0);
    if(Math.abs(ps - 1) > 0.011) add('warn', '全局', '情景概率合计 ' + (ps * 100).toFixed(1) + '%，应为 100%');
  }
  const mc = toNum(r.verdict && r.verdict.mainline_count);
  if(mc !== null && mc !== list.length) add('warn', '全局', 'verdict.mainline_count 写 ' + Math.round(mc) + '，实际 ' + list.length + ' 条');
  const ranks = list.map(m => toNum(m.rank));
  if(ranks.some((v, i) => v !== i + 1))
    add('warn', '全局', 'rank 不是从 1 连续编号：' + ranks.map(v => v === null ? '—' : Math.round(v)).join(', '));
  const scores = list.map(m => toNum(m.score));
  if(scores.length && scores.every(v => v !== null) && scores.some((v, i) => i > 0 && scores[i - 1] < v))
    add('warn', '全局', '主线未按分数降序排列');

  const err = items.filter(x => x.level === 'err').length + Object.keys(of).reduce((s, k) => s + of[k].filter(x => x.level === 'err').length, 0);
  const warn = items.filter(x => x.level === 'warn').length + Object.keys(of).reduce((s, k) => s + of[k].filter(x => x.level === 'warn').length, 0);
  /* 归一化层动过的手脚也要留痕：加载旧报告时没人会去翻导入诊断 */
  const fx = (r.__fixes || []).length;
  if(fx) add('info', '归一化', '有 ' + (r.__fixTotal || fx) + ' 处字段在渲染前被自动修正（字符串转数值、百分数折小数、非法枚举置空等），页面显示的是修正后的值，不是报告原文');
  return { items: items, of: of, err: err, warn: warn, total: err + warn, notes: items.filter(x => x.level === 'info').length };
}


/* 宽松归一化：结构可以补，结论不能补。
   缺失字段补成空数组 / 空对象 / 空串，但**数字与状态保持 null**——
   页面显示「—」或「未判定」，绝不用 0 分、0% 或默认阶段冒充结论。 */
function normalize(raw){
  NORM_FIXES = []; NORM_TOTAL = 0;
  const fixes = NORM_FIXES;
  const r = JSON.parse(JSON.stringify(raw || {}));
  const arr = v => Array.isArray(v) ? v : [];
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  const str = (v, d) => (v === null || v === undefined) ? (d === undefined ? '' : d) : String(v).trim();
  const strs = v => arr(v).map(x => (x === null || x === undefined) ? '' : String(x));

  /* 数值：字符串转数值 → 百分数折回小数 → 区间钳制，每一步都记进 fixes */
  const numAt = (v, path, opt) => {
    const o = opt || {};
    let n = toNum(v);
    if(n === null){
      if(v !== null && v !== undefined && String(v).trim() !== '') noteFix(path, v, null, '无法识别→null');
      return null;
    }
    if(typeof v === 'string') noteFix(path, v, n, '字符串→数值');
    if(o.ratio && Math.abs(n) > 1){
      const s = n / 100;
      /* 涨幅类字段在 1~3 之间是真正的歧义区：1.05 既可能是 105%（真实翻倍），也可能是 1.05%。
         折算了也必须标出来，让人知道这里被动过。 */
      const amb = o.chg && Math.abs(n) <= 3;
      noteFix(path, v, s, amb ? '百分数→小数（原值 1~3，可能是真实涨幅，请复核）' : '百分数→小数');
      n = s;
    }
    return clampNum(n, o.lo, o.hi, path, v);
  };
  const intAt = (v, path, lo, hi) => { const n = numAt(v, path, { lo:lo, hi:hi }); return n === null ? null : Math.round(n); };

  r.schema_version = str(r.schema_version, '1.0.0');

  r.meta = Object.assign({ report_id:'—', as_of:'—', generated_at:'—', title:'A股市场主线分析', data_mode:null, confidence:null, analyst:{}, tags:[] }, obj(r.meta));
  r.meta.tags = strs(r.meta.tags);
  r.meta.confidence = numAt(r.meta.confidence, 'meta.confidence', { ratio:1, lo:0, hi:1 });
  const rawMode = r.meta.data_mode;
  r.meta.data_mode = enumPick(rawMode, DATA_MODE_ALIAS);
  if(rawMode && r.meta.data_mode !== rawMode) noteFix('meta.data_mode', rawMode, r.meta.data_mode, '枚举归一');
  r.meta.analyst = obj(r.meta.analyst);

  r.window = Object.assign({ as_of:r.meta.as_of, primary_days:20, confirm_days:5, context_days:60, quantile_days:250, rules:[], excluded:[] }, obj(r.window));
  r.window.primary_days = intAt(r.window.primary_days, 'window.primary_days', 1, 500);
  r.window.rules = arr(r.window.rules).map(String);
  r.window.excluded = arr(r.window.excluded);
  r.window.effective_range = obj(r.window.effective_range);

  r.data_quality = Object.assign({ status:null, coverage:null, sources:[], missing:[], notes:[] }, obj(r.data_quality));
  r.data_quality.status = ['ok','partial','degraded'].indexOf(r.data_quality.status) >= 0 ? r.data_quality.status : null;
  r.data_quality.coverage = numAt(r.data_quality.coverage, 'data_quality.coverage', { ratio:1, lo:0, hi:1 });
  r.data_quality.sources = arr(r.data_quality.sources).map((s, j) => {
    const x = obj(s);
    return {
      name: str(x.name), category: str(x.category), fields: strs(x.fields),
      as_of: str(x.as_of), reliability: ['high','medium','low'].indexOf(x.reliability) >= 0 ? x.reliability : null, note: str(x.note)
    };
  });
  r.data_quality.missing = arr(r.data_quality.missing).map(m => {
    const x = obj(m);
    return { field: str(x.field), reason: str(x.reason), fallback: str(x.fallback) };
  });
  r.data_quality.notes = arr(r.data_quality.notes).map(String);

  r.market_regime = Object.assign({ label:'—', phase:null, phase_label:'', risk_appetite:null, liquidity:null, breadth_score:null, indices:[], breadth:{}, narrative:'' }, obj(r.market_regime));
  r.market_regime.phase = ['risk_on','risk_off','structural','choppy'].indexOf(r.market_regime.phase) >= 0 ? r.market_regime.phase : null;
  const temp = (v, path) => numAt(v, path, { lo:0, hi:100 });
  r.market_regime.risk_appetite = temp(r.market_regime.risk_appetite, 'market_regime.risk_appetite');
  r.market_regime.liquidity = temp(r.market_regime.liquidity, 'market_regime.liquidity');
  r.market_regime.breadth_score = temp(r.market_regime.breadth_score, 'market_regime.breadth_score');
  r.market_regime.indices = arr(r.market_regime.indices).map((ix, j) => {
    const x = obj(ix), p = 'market_regime.indices[' + j + ']';
    return {
      code: str(x.code), name: str(x.name),
      close: numAt(x.close, p + '.close'),
      chg_1d: numAt(x.chg_1d, p + '.chg_1d', { ratio:1 }),
      chg_5d: numAt(x.chg_5d, p + '.chg_5d', { ratio:1 }),
      chg_20d: numAt(x.chg_20d, p + '.chg_20d', { ratio:1 }),
      turnover_yi: numAt(x.turnover_yi, p + '.turnover_yi'),

/* ============ 宽容 JSON 解析 ============
   模型输出的常见瑕疵：代码围栏、前言后语、尾逗号、注释、中文引号、
   Python 字面量（None/True）、中段截断。下面按「逐步加码」的方式
   生成候选文本，逐个尝试解析，取最像报告的那个。 */

/* 从 start 处的 { 或 [ 找到配对闭合位置，识别字符串与转义 */
function scanBalanced(s, start){
  const open = s.charAt(start);
  const close = open === '{' ? '}' : ']';
  let depth = 0, inStr = false, esc = false;
  for(let i = start; i < s.length; i++){
    const c = s.charAt(i);
    if(inStr){
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; continue; }
    if(c === open) depth++;
    else if(c === close){ depth--; if(depth === 0) return i; }
  }
  return -1;
}

/* 去掉字符串外的行注释与块注释 */
function stripComments(s){
  let out = '', inStr = false, esc = false;
  for(let i = 0; i < s.length; i++){
    const c = s.charAt(i), n = s.charAt(i + 1);
    if(inStr){
      out += c;
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; out += c; continue; }
    if(c === '/' && n === '/'){ while(i < s.length && s.charAt(i) !== '\n') i++; out += '\n'; continue; }
    if(c === '/' && n === '*'){ i += 2; while(i < s.length && !(s.charAt(i) === '*' && s.charAt(i + 1) === '/')) i++; i++; continue; }
    out += c;
  }
  return out;
}

/* 基础清洗：BOM、零宽字符、代码围栏、尾逗号、注释 */
function basicClean(t){
  let s = String(t == null ? '' : t);
  s = s.replace(/^\uFEFF/, '').replace(/[\u200B-\u200D\u2060\uFEFF]/g, '');
  s = s.replace(/^[ \t]*```[a-zA-Z0-9_+-]*[ \t]*$/gm, '').replace(/```/g, '');
  s = stripComments(s);
  s = s.replace(/,(\s*[}\]])/g, '$1');
  s = s.replace(/[\u00A0\u3000]/g, ' ');
  return s.trim();
}

function pyFix(t){
  return pyQuote(String(t).replace(/\bNone\b/g, 'null').replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false'));
}

/* 单引号字符串 → JSON 双引号字符串（Agent 常把 Python dict 直接吐出来） */
function pyQuote(t){
  const s = String(t);
  let out = '', i = 0, inD = false, esc = false;
  while(i < s.length){
    const c = s.charAt(i);
    if(inD){
      out += c;
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inD = false;
      i++;
      continue;
    }
    if(c === '"'){ inD = true; out += c; i++; continue; }
    if(c === "'"){
      i++; out += '"';
      while(i < s.length){
        const d = s.charAt(i);
        if(d === '\\'){
          const n = s.charAt(i + 1);
          if(n === "'"){ out += "'"; i += 2; continue; }
          if(n === '"'){ out += '\\"'; i += 2; continue; }
          out += d + n; i += 2; continue;
        }
        if(d === '"'){ out += '\\"'; i++; continue; }
        if(d === "'"){ out += '"'; i++; break; }
        out += d; i++;
      }
      continue;
    }
    out += c; i++;
  }
  return out;
}

/* 中文全角引号当分隔符用（模型常见）→ 半角，但只转换紧邻结构符号的那些 */
function smartFix(t){
  return String(t)
    .replace(/([\{\[,:\s])\u201C/g, '$1"')
    .replace(/\u201D(\s*[:,}\]])/g, '"$1');
}

/* 截断修复：在某个逗号处截断，补齐未闭合的括号 */
function closeUnbalanced(s){
  let inStr = false, esc = false, stack = [], cuts = [];
  for(let i = 0; i < s.length; i++){
    const c = s.charAt(i);
    if(inStr){
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; continue; }
    if(c === '{') stack.push('}');
    else if(c === '[') stack.push(']');
    else if(c === '}' || c === ']'){ if(stack.length) stack.pop(); }
    else if(c === ',') cuts.push({ i: i, open: stack.slice() });
  }
  const direct = s + stack.slice().reverse().join('');
  try{ JSON.parse(direct); return direct; }catch(e){}
  for(let k = cuts.length - 1; k >= 0 && k >= cuts.length - 60; k--){
    const body = s.slice(0, cuts[k].i);
    const cand = body + cuts[k].open.slice().reverse().join('');
    try{ JSON.parse(cand); return cand; }catch(e){}
  }
  return null;
}

/* 拆出文本中所有顶层 JSON 片段 */
function extractSegments(s){
  const out = [];
  for(let i = 0; i < s.length; i++){
    const c = s.charAt(i);
    if(c !== '{' && c !== '[') continue;
    const end = scanBalanced(s, i);
    if(end > i){ out.push(s.slice(i, end + 1)); i = end; }
  }
  return out;
}

/* 把各种包装形态归一到「带 mainlines 的报告对象」 */
/* 判断一个对象像不像「主线」：只有 name 不够——板块列表、驱动数组也都带 name。
   必须同时带上主线特有的量化字段，否则会把文本里任意一个对象数组当成 mainlines。 */
function looksLikeMainline(x){
  if(!x || typeof x !== 'object' || Array.isArray(x)) return false;
  if(!(x.name || x.id)) return false;
  return x.score !== undefined || x.stage !== undefined || x.score_breakdown !== undefined
      || x.rank !== undefined || x.metrics !== undefined || x.theme_type !== undefined;
}

function unwrapReport(d){
  if(!d || typeof d !== 'object') return null;
  if(Array.isArray(d)){
    const ok = d.length && d.every(looksLikeMainline);
    return ok ? { mainlines: d } : null;
  }
  const keys = ['mainlines', 'main_lines', 'lines', '主线'];
  for(const k of keys){
    if(d[k] && typeof d[k] === 'object') return fixMainlines(d, k);
  }
  if(d.report && typeof d.report === 'object') return unwrapReport(d.report);
  if(d.data && typeof d.data === 'object') return unwrapReport(d.data);
  if(d.result && typeof d.result === 'object') return unwrapReport(d.result);
  if(d.output && typeof d.output === 'object') return unwrapReport(d.output);
  if(looksLikeMainline(d)) return { mainlines: [d] };
  return d;
}

function fixMainlines(d, key){
  const v = d[key];
  if(!Array.isArray(v)){
    const list = Object.keys(v).map(k => v[k]).filter(x => x && typeof x === 'object');
    const copy = Object.assign({}, d);
    copy.mainlines = list;
    return copy;
  }
  if(key !== 'mainlines'){
    const copy = Object.assign({}, d);
    copy.mainlines = v;
    return copy;
  }
  return d;
}

/* 把内部标签翻成人话 */
function friendlyTag(tag){
  const map = {
    '原样': '内容本身即为合法 JSON',
    '基础清洗': '清洗后解析（去围栏 / 注释 / 尾逗号）',
    'Python 字面量': '按 Python 字面量修正后解析',
    '中文引号': '修正中文引号后解析',
    '综合修复': '多轮修复后解析',
    '多段合并': '多段输出按主线合并'
  };
  const cut = tag.indexOf('补齐截断') >= 0;
  if(cut) return '按截断修复后解析（已补齐括号，末尾内容可能缺失，建议让模型重发完整版）';
  const base = tag.split('·')[0];
  return (map[base] || base);
}

/* 多段合并：模型把报告拆成两次回复时，把几段 JSON 合成一份 */
function mergeReports(reps){
  const base = JSON.parse(JSON.stringify(reps[0]));
  const seen = {}, list = [];
  reps.forEach(r => (r.mainlines || []).forEach(m => {
    const key = String(m.id || m.name || '').trim();
    if(!key || seen[key]) return;
    seen[key] = 1; list.push(m);
  }));
  base.mainlines = list
    .sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0))
    .map((m, i) => Object.assign({}, m, { rank: i + 1 }));
  const fill = ['window', 'data_quality', 'market_regime', 'verdict', 'rotation', 'playbook', 'appendix'];
  reps.slice(1).forEach(r => {
    fill.forEach(k => { if(!base[k] && r[k]) base[k] = r[k]; });
    ['risks', 'scenarios'].forEach(k => {
      if(!(base[k] && base[k].length) && r[k] && r[k].length) base[k] = r[k];
    });
  });
  if(base.verdict) base.verdict.mainline_count = base.mainlines.length;
  return base;
}

/* 主入口：返回 { data, notes:[], error } */
function parseJsonLoose(text){
  const raw = String(text == null ? '' : text);
  const notes = [];
  if(!raw.trim()) return { data:null, notes:notes, error:'内容为空' };

  const base = basicClean(raw);
  if(base !== raw.trim() && /```/.test(raw)) notes.push('已剥离代码围栏');
  if(/^\uFEFF/.test(raw) || /[\u200B-\u200D\u2060]/.test(raw)) notes.push('已清理不可见字符');
  if(/[\u201C\u201D]/.test(base)) notes.push('已修正中文引号');

  const variants = [
    { tag:'原样', text: raw },
    { tag:'基础清洗', text: base },
    { tag:'Python 字面量', text: pyFix(base) },
    { tag:'中文引号', text: smartFix(base) },
    { tag:'综合修复', text: basicClean(smartFix(pyFix(raw))) }
  ];

  const found = [];
  const seen = {};
  const tryText = (t, tag, allowCut) => {
    if(!t || seen[t]) return;
    seen[t] = 1;
    const push = (obj, how, cut) => {
      if(obj && typeof obj === 'object') found.push({ data:obj, tag:tag + (how ? '·' + how : ''), cut: !!cut, size: JSON.stringify(obj).length });
    };
    try{ push(JSON.parse(t)); return; }catch(e){}
    for(const seg of extractSegments(t)){
      try{ push(JSON.parse(seg)); }catch(e){}
    }
    if(allowCut){
      const fixed = closeUnbalanced(t.slice(Math.max(0, t.indexOf('{'))));
      if(fixed){ try{ push(JSON.parse(fixed), '补齐截断', true); }catch(e){} }
    }
  };

  variants.forEach(v => tryText(v.text, v.tag, true));
  if(!found.length) return { data:null, notes:notes, error:'未找到可解析的 JSON 结构（可能只输出了说明文字，或 JSON 未写完）' };

  let best = null, bestRank = -1;
  found.forEach(f => {
    const u = unwrapReport(f.data);
    const list = u && Array.isArray(u.mainlines) ? u.mainlines : null;
    /* 优先级：含 mainlines > 未截断 > 主线条数 > 体积。
       截断补齐的 5 条不能盖掉完整输出的 3 条——补出来的只是括号，
       缺的是 risks / scenarios / playbook 这些尾部字段。 */
    const rank = (list ? 1 : 0) * 1e18
               + (f.cut ? 0 : 1e15)
               + (list ? Math.min(list.length, 99) : 0) * 1e13
               + Math.min(f.size, 9e12);
    if(rank > bestRank){ bestRank = rank; best = { data:u || f.data, tag:f.tag, count: list ? list.length : 0, cut: !!f.cut }; }
  });

  // 多段合并：把几段独立 JSON 一起粘进来时合并主线，而不是只取其中一段
  const segs = extractSegments(base);
  if(segs.length > 1){
    const reps = [];
    segs.forEach(seg => {
      try{
        const o = unwrapReport(JSON.parse(seg));
        if(o && Array.isArray(o.mainlines) && o.mainlines.length) reps.push(o);
      }catch(e){}
    });
    if(reps.length > 1){
      const merged = mergeReports(reps);
      if(merged.mainlines.length > (best.count || 0)){
        best = { data: merged, tag: '多段合并', count: merged.mainlines.length, cut: false };
        notes.push('合并了 ' + reps.length + ' 段输出');
      }
    }
  }

  notes.push('识别方式：' + friendlyTag(best.tag));
  if(!best.count) return { data:best.data, notes:notes, error:'JSON 解析成功，但其中没有 mainlines 数组（当前版本要求至少 1 条主线）' };
  return { data:best.data, notes:notes, error:'', cut: !!best.cut };
}

/* ============ Vue 应用 ============ */
const { createApp, ref, computed, onMounted, onUnmounted, watch, nextTick } = Vue;

createApp({
  setup(){

    const initialHit = initialDom ? report.value.mainlines.filter(m => m.id === initialDom || m.name === initialDom)[0] : null;
    const activeId = ref((initialHit || report.value.mainlines[0] || {}).id || '');

    const sortDir = ref(-1);
    const tplTab = ref('prompt');
    const drawer = ref(null);          // 'template' | 'import'
    const importText = ref('');
    const importDiag = ref('');
    const importState = ref('');       // '' | 'ok' | 'warn' | 'err'
    const lastFixes = ref([]);         // 本次导入被自动修正的字段（最多展示 40 条）
    const lastFixTotal = ref(0);       // 实际修正次数（展示条数会截断，计数不截断）
    const toastMsg = ref('');
    const toastOn = ref(false);
    const fileEl = ref(null);
    let toastTimer = null;
    let lastFocus = null;              // 抽屉打开前的焦点，关闭后还回去

    function toast(msg){
      toastMsg.value = msg; toastOn.value = true;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastOn.value = false; }, 2200);
    }

    /* ---- 导航联动（scrollspy）----
       判定线取导航下方 96px：section 顶部越过该线即视为「当前所在」。 */
    const NAV = [
      { id:'verdict',  label:'结论' },
      { id:'regime',   label:'市场' },
      { id:'leaders',  label:'主线' },
      { id:'detail',   label:'拆解' },
      { id:'rotation', label:'轮动' },
      { id:'risk',     label:'风险' },
      { id:'method',   label:'口径' }
    ];
    const navId = ref(NAV[0].id);
    const navLinks = ref(null);   // .nav-links 容器，用于量取指示条位置
    let navPending = 0;       // 滚动节流定时器
    let navLockUntil = 0;     // 平滑滚动期间锁住高亮，避免途经的章节闪一下

    /* 把指示条对齐到当前页签的文字宽度上（不含左右内边距） */
    function moveInk(){
      const box = navLinks.value;
      if(!box) return;
      const el = box.querySelector('a.on');
      if(!el || !el.offsetWidth){ box.classList.remove('ink-on'); return; }
      const b = box.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      const padL = parseFloat(cs.paddingLeft) || 0;
      const padR = parseFloat(cs.paddingRight) || 0;
      box.style.setProperty('--ink-x', (r.left - b.left + padL).toFixed(2) + 'px');
      box.style.setProperty('--ink-w', Math.max(0, r.width - padL - padR).toFixed(2) + 'px');
      box.classList.add('ink-on');
    }

    function visibleSections(){
      return NAV.filter(s => {
        const el = document.getElementById(s.id);
        return el && el.getBoundingClientRect().height > 0;
      });
    }
    function syncNav(){
      if(Date.now() < navLockUntil) return;
      const LINE = 96;
      const list = visibleSections();
      if(!list.length) return;
      let cur = list[0].id;
      for(const s of list){
        const top = document.getElementById(s.id).getBoundingClientRect().top;
        if(top <= LINE) cur = s.id;
      }
      /* 滚到底时强制高亮最后一节：末尾章节若短于视口，其顶部可能永远到不了判定线 */
      const doc = document.documentElement;
      if(window.scrollY + window.innerHeight >= doc.scrollHeight - 2) cur = list[list.length - 1].id;
      if(navId.value !== cur) navId.value = cur;
    }
    /* 60ms 尾随节流：不用 rAF，避免标签页后台/不可见时回调不触发把标志位卡死 */
    function onNavScroll(){
      if(navPending) return;
      navPending = setTimeout(() => {
        navPending = 0; syncNav(); moveInk();
        /* 滚动后给导航加一道浅投影，视觉上与内容分层 */
        const bar = document.querySelector('.nav');
        if(bar) bar.classList.toggle('scrolled', window.scrollY > 8);
      }, 60);
    }
    function jumpTo(s){
      navId.value = s.id;

      /* 点击后交给 CSS 的 scroll-behavior 平滑滚动，锁住高亮直到滚动收敛 */
      navLockUntil = Date.now() + 700;
      setTimeout(() => { navLockUntil = 0; syncNav(); }, 760);
    }
    /* 抽屉的键盘约定：Esc 关闭，Tab 在抽屉内循环（不把焦点漏到背后的报告上） */
    function onKeydown(e){
      if(!drawer.value) return;
      if(e.key === 'Escape'){ e.preventDefault(); closeDrawer(); return; }
      if(e.key !== 'Tab') return;
      const box = document.querySelector('.drawer');
      if(!box) return;
      const nodes = box.querySelectorAll('a[href], button, textarea, input, select, [tabindex]:not([tabindex="-1"])');
      const list = Array.prototype.filter.call(nodes, el => !el.disabled && el.offsetParent !== null);
      if(!list.length) return;
      const first = list[0], last = list[list.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
    onMounted(() => {
      syncNav();
      nextTick(moveInk);
      /* 字体/布局落定后再量一次，避免首屏指示条偏半个字 */
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => nextTick(moveInk));
      window.addEventListener('scroll', onNavScroll, { passive:true });
      window.addEventListener('resize', onNavScroll);
      window.addEventListener('keydown', onKeydown);
    });
    onUnmounted(() => {
      window.removeEventListener('scroll', onNavScroll);
      window.removeEventListener('resize', onNavScroll);
      window.removeEventListener('keydown', onKeydown);
      clearTimeout(navPending);
    });
    /* 导入新数据或切换主线后，章节高度会变，重新量一次 */
    watch(report, () => nextTick(() => { syncNav(); moveInk(); }));
    watch(activeId, () => nextTick(syncNav));
    /* navId 变了才需要挪指示条，DOM 更新后再量 */
    watch(navId, () => nextTick(moveInk), { flush:'post' });

    /* ---- 计算属性 ---- */
    const mainlines = computed(() => report.value.mainlines);
    const active = computed(() => {
      const list = mainlines.value;
      return list.find(m => m.id === activeId.value) || list[0] || null;
    });
    const sortedMainlines = computed(() => {
      const list = [...mainlines.value];
      const k = sortKey.value, d = sortDir.value;
      const get = m => {
        if(k === 'score') return m.score;
        if(k === 'name') return m.name;
        return isN(m.metrics[k]) ? -1e9 : m.metrics[k];
      };
      return list.sort((a, b) => {
        const va = get(a), vb = get(b);
        if(typeof va === 'string') return d * va.localeCompare(vb, 'zh');
        return d * (va - vb);
      });
    });
    const totalWeight = computed(() =>
      (report.value.appendix.weights || []).reduce((s, w) => s + (toNum(w.weight) || 0), 0));
    /* 六项贡献之和：任何一项缺失就返回 null——宁可显示「—」，也不给一个看着完整的假和 */
    const sumContribution = computed(() => {
      const m = active.value; if(!m) return null;
      const list = m.score_breakdown || [];
      if(!list.length) return null;
      let s = 0;
      for(const b of list){ const c = toNum(b.contribution); if(c === null) return null; s += c; }
      return s;
    });
    /* 复算分：Σ贡献 − 惩罚。页面上会拿它和报告记录的 score 对照，不一致就标出来 */
    const recomputedScore = computed(() => {
      const m = active.value;
      const pen = m ? toNum(m.penalty) : null;
      return (sumContribution.value === null || pen === null) ? null : sumContribution.value - pen;
    });
    const scoreAudit = computed(() => {
      const m = active.value;
      const rec = recomputedScore.value;
      const got = m ? toNum(m.score) : null;
      if(rec === null || got === null) return null;
      const diff = rec - got;
      return { diff: diff, ok: Math.abs(diff) <= 0.5 };
    });
    /* 契约体检：报告写下的每个可复算结论，都按提示词的规则重算一遍 */
    const audit = computed(() => {
      const a = auditReport(report.value);
      const rows = a.items.slice();
      Object.keys(a.of).forEach(k => {
        const hit = report.value.mainlines.filter(m => String(m.id) === k)[0];
        const nm = (hit && hit.name) || k;
        a.of[k].forEach(f => rows.push({ level: f.level, scope: nm, text: f.text }));
      });
      const rank = { err: 0, warn: 1, info: 2 };
      a.rows = rows.sort((x, y) => (rank[x.level] || 9) - (rank[y.level] || 9));
      return a;
    });
    const activeFlags = computed(() => {
      const m = active.value;
      if(!m) return [];
      return (audit.value.of[String(m.id || m.name)] || []).slice();
    });
    /* 时效性：报告是"某一天"的快照，过期了就必须说 */
    const freshness = computed(() => {
      const day = (s) => {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
        if(!m) return null;
        const t = Date.UTC(+m[1], +m[2] - 1, +m[3]);
        return isFinite(t) ? t : null;
      };
      const asOf = day(report.value.meta.as_of);
      if(asOf === null) return null;
      const now = new Date();
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const age = Math.floor((today - asOf) / 86400000);
      const until = day(report.value.verdict.horizon && report.value.verdict.horizon.valid_until);
      return {
        asOf: report.value.meta.as_of,
        age: age,
        stale: age > 7,
        expired: until !== null && until < today,
        validUntil: report.value.verdict.horizon ? report.value.verdict.horizon.valid_until : ''
      };
    });
    const windowStats = computed(() => [
      { k:'基准交易日', v:report.value.meta.as_of, s:'' },
      { k:'主判定窗口', v:report.value.window.primary_days, s:'交易日' },
      { k:'主线数量', v:mainlines.value.length, s:'条' },
      { k:'数据覆盖', v:pct(report.value.data_quality.coverage, 0), s:'' },
      { k:'结论置信度', v:pct(report.value.verdict.confidence, 0), s:'' }

    const ringDash = computed(() => {

    const ringColor = computed(() => active.value ? scoreTone(active.value.score) : '#8d9bb0');
    const concentration = computed(() => {
      const list = [...mainlines.value]
        .sort((a, b) => (a.rank || 99) - (b.rank || 99))

      const shares = list.map(m => toNum(m.metrics.turnover_share));

         否则 2 条的和会被读成 3 条的合计。 */
      const full = got.length > 0 && got.length === list.length;
      return {
        items: list,
        total: full ? got.reduce((s, v) => s + v, 0) : null,
        partial: (!full && got.length) ? got.reduce((s, v) => s + v, 0) : null,
        got: got.length,

    /* 导入诊断：把解析层与归一化层的修正都摊开，别让用户以为「显示出来的就是原件」 */
    function diagText(res, fixes, total){
      const n = (res.data && Array.isArray(res.data.mainlines)) ? res.data.mainlines.length : 0;
      const lines = [];
      if(res.error){
        lines.push('✕ ' + res.error);

      }
      if(res.notes && res.notes.length) lines.push(res.notes.join(' · '));
      const cnt = total || (fixes ? fixes.length : 0);
      if(fixes && fixes.length){
        const head = fixes.slice(0, 6).map(f => f.kind + ' ' + f.path + (f.from !== '' ? '（' + f.from + '）' : '')).join('\n· ');
        lines.push('自动修正 ' + cnt + ' 处' + (cnt > fixes.length ? '（展示前 ' + fixes.length + ' 条）' : '') +

          窗口内已剔除：
          <span v-for="(e, i) in report.window.excluded" :key="i" class="num">
            {{ e.date_range || '—' }}<template v-if="e.reason">（{{ e.reason }}）</template><template v-if="i < report.window.excluded.length - 1">、</template>
          </span>
        </div>
        <div class="mute num" style="font-size:11px;margin-top:16px">
          生成时间 {{ report.meta.generated_at }} · Schema v{{ report.schema_version }} · 报告编号 {{ report.meta.report_id }}
          <span v-if="report.meta.analyst && report.meta.analyst.model"> · 模型 {{ report.meta.analyst.model }}</span>
          <span v-if="report.meta.analyst && report.meta.analyst.prompt_version"> · 提示词 v{{ report.meta.analyst.prompt_version }}</span>
          <span v-if="report.meta.analyst && report.meta.analyst.operator"> · {{ report.meta.analyst.operator }}</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== TEMPLATE CTA ===== -->
  <section class="band band-tight">
    <div class="wrap">
      <div class="card cta">
        <div>
          <div class="eyebrow">08 — 提示词模板</div>
          <h2>把任何模型变成主线研究员</h2>
          <p style="font-size:13.5px;line-height:1.65;color:var(--mute);margin-top:12px">
            完整版包含时间粒度设计、反脉冲三原则、六因子打分卡、五阶段判定与自检清单，配合 JSON Schema 可直接用于结构化输出约束。
          </p>
          <div class="cta-actions">
            <button class="btn btn-primary" @click="openDrawer('template')">查看 / 复制模板</button>
            <button class="btn btn-ghost" @click="copyText(EMBEDDED.prompt, '完整提示词')">一键复制完整版</button>
          </div>
        </div>
        <div class="cta-steps">
          <div class="eyebrow">使用流程</div>
          <div v-for="(step, i) in ['复制提示词 → 填入基准交易日','交由模型取数并推理','获得严格 JSON 输出','导入本页渲染报告']" :key="i" class="step">
            <span class="step-n num">0{{ i+1 }}</span>
            <span class="step-t">{{ step }}</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="wrap">
      <div class="foot-grid">
        <div>
          <div class="brand" style="margin-bottom:12px"><span class="dot"></span>主线雷达<small>MAINLINE RADAR</small></div>
          <p>结构化 A 股主线分析框架。四窗嵌套时间粒度、反脉冲三原则、六因子打分卡、五阶段生命周期模型。</p>
        </div>
        <div>
          <h5>数据口径</h5>
          <ul>
            <li>主判定窗口：20 个交易日</li>
            <li>资金流：算法测算值</li>
            <li>拥挤度：250 日分位</li>
            <li>北向资金：不纳入日度因子</li>
          </ul>
        </div>
        <div>
          <h5>文件</h5>
          <ul>
            <li>prompt/ashare-mainline-prompt.md</li>
            <li>schema/ashare-mainline.schema.json</li>
            <li>samples/sample-report.json</li>
            <li>samples/empty-template.json</li>
          </ul>
        </div>
      </div>
      <div class="legal">
        本页内容为市场结构研究，不构成投资建议，不承诺任何收益。当前展示为
        <b style="font-weight:400">{{ report.meta.data_mode === 'demo' ? '示例数据（非真实行情）' : report.meta.data_mode === 'live' ? '实盘数据' : report.meta.data_mode === 'delayed' ? '延迟数据' : '来源未标注' }}</b>，
        所有资金流字段为按单笔金额分档推断的算法测算值，与真实成交存在偏差。使用者应自行核验数据并独立承担决策责任。
        <button class="link-btn" @click="resetDemo">恢复示例数据</button>
      </div>
    </div>
  </footer>

  <!-- ===== DRAWER ===== -->
  <div class="overlay no-print" v-if="drawer" @click.self="closeDrawer">
    <div class="drawer" role="dialog" aria-modal="true" :aria-label="drawer === 'import' ? '导入分析 JSON' : '提示词模板与输出契约'">
      <div class="drawer-h">
        <h3>{{ drawer === 'import' ? '导入分析 JSON' : '提示词模板与输出契约' }}</h3>
        <div class="spacer"></div>
        <span class="mute" style="font-size:10.5px">Esc 关闭</span>
        <button class="btn btn-quiet btn-sm" @click="closeDrawer">关闭</button>
      </div>

      <div class="drawer-b" v-if="drawer === 'import'">
        <div class="tabs">
          <button class="tab on">粘贴 JSON</button>
          <button class="tab" @click="fileEl && fileEl.click()">选择文件</button>
          <button class="tab" @click="importText = JSON.stringify(EMBEDDED.template, null, 2)">装入空白模板</button>
        </div>
        <textarea class="code" v-model="importText" placeholder="把模型输出的内容整段粘进来即可：纯 JSON、被 markdown 代码块包裹的 JSON、带前言后语的回答都能识别，不需要手动删除围栏。"></textarea>
        <input type="file" accept=".json,.jsonl,.txt,application/json,text/plain" ref="fileEl" @change="onFile" style="display:none">
        <div class="diag" v-if="importDiag" :class="importState">{{ importDiag }}</div>
        <p class="mute" style="font-size:11.5px;line-height:1.6;margin-top:12px">
          导入前会自动清洗：代码围栏、前后说明文字、尾逗号、注释、中文引号、Python 字面量（<code>None</code>/<code>True</code>）、以及中段被截断的 JSON（会尝试补齐括号）。
          数字写成字符串（<code>"87.6"</code>）、比率写成百分数（<code>5.21</code> 表示 5.21%）也会被自动折算，折算明细会列在上面的诊断里。
          <b style="font-weight:400;color:var(--ink2)">缺失的字段不会被补成 0</b>——页面上显示「—」或「未判定」，不会把没取到的数据伪装成结论。但 <code>mainlines</code> 数组必须存在。
        </p>
        <p class="mute" style="font-size:11.5px;line-height:1.6;margin-top:8px">
          从聊天网页版复制时，请点代码块右上角的复制图标——直接框选长代码块只会拿到可见部分。若模型分两次给出，把两段一起粘进来，会按主线自动合并。当前 {{ importText.length }} 字符。
        </p>
      </div>

      <div class="drawer-b" v-else>
        <div class="tabs">
          <button class="tab" :class="{on: tplTab==='prompt'}" @click="tplTab='prompt'">完整版（API/Agent）</button>
          <button class="tab" :class="{on: tplTab==='schema'}" @click="tplTab='schema'">JSON Schema</button>
          <button class="tab" :class="{on: tplTab==='blank'}" @click="tplTab='blank'">空白模板</button>
          <button class="tab" :class="{on: tplTab==='sample'}" @click="tplTab='sample'">当前数据</button>
        </div>

        <template v-if="tplTab==='prompt'">
          <div class="diag" style="margin:0 0 12px">
            用于 API / Agent / 有文件写入能力的运行环境。提示词约 {{ (EMBEDDED.prompt.length/1000).toFixed(1) }}K 字符，要求模型输出 20K～32K 字符的完整 JSON（3～5 条主线，上限 40K）；提示词 §10-D 已写明排版与压缩顺序。
          </div>
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="btn btn-primary btn-sm" @click="copyText(EMBEDDED.prompt, '完整提示词')">复制完整版</button>
            <button class="btn btn-quiet btn-sm" @click="downloadText('ashare-mainline-prompt.md', EMBEDDED.prompt)">下载 .md</button>
          </div>
          <pre class="code">{{ EMBEDDED.prompt }}</pre>
        </template>

        <template v-else-if="tplTab==='schema'">
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="btn btn-primary btn-sm" @click="copyText(JSON.stringify(EMBEDDED.schema, null, 2), 'JSON Schema')">复制 Schema</button>
            <button class="btn btn-quiet btn-sm" @click="downloadText('ashare-mainline.schema.json', JSON.stringify(EMBEDDED.schema, null, 2), 'application/json')">下载 .json</button>
          </div>
          <pre class="code">{{ JSON.stringify(EMBEDDED.schema, null, 2) }}</pre>
        </template>

        <template v-else-if="tplTab==='blank'">
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="btn btn-primary btn-sm" @click="copyText(JSON.stringify(EMBEDDED.template, null, 2), '空白模板')">复制模板</button>
            <button class="btn btn-quiet btn-sm" @click="downloadText('ashare-mainline-template.json', JSON.stringify(EMBEDDED.template, null, 2), 'application/json')">下载 .json</button>
          </div>
          <pre class="code">{{ JSON.stringify(EMBEDDED.template, null, 2) }}</pre>
        </template>

        <template v-else>
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="btn btn-primary btn-sm" @click="copyText(JSON.stringify(report, null, 2), '当前数据')">复制当前数据</button>
            <button class="btn btn-quiet btn-sm" @click="exportJson">导出 .json</button>
            <button class="btn btn-quiet btn-sm" @click="resetDemo">恢复示例数据</button>
          </div>
          <pre class="code">{{ JSON.stringify(report, null, 2) }}</pre>
        </template>
      </div>

      <div class="drawer-f" v-if="drawer === 'import'">
        <button class="btn btn-quiet btn-sm" @click="closeDrawer">取消</button>
        <button class="btn btn-quiet btn-sm" @click="doImport(true)">仅校验</button>
        <button class="btn btn-primary btn-sm" @click="doImport(false)">解析并渲染</button>
      </div>
    </div>
  </div>

  <div class="toast" :class="{on: toastOn}">{{ toastMsg }}</div>
</div>
`
}).mount('#app');
</script>
</body>
</html>
